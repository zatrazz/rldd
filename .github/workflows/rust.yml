name: Rust

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each build inspects the host object format only: ELF on Linux, Mach-O on
  # macOS, and PE on Windows.
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Build
      run: cargo build --locked --verbose
    - name: Test
      run: cargo test --locked --verbose

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Build
      run: cargo build --locked --verbose
    - name: Test
      run: cargo test --locked --verbose

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Build
      run: cargo build --locked --verbose
    - name: Test
      run: cargo test --locked --verbose

  # The other ELF systems, checked since there is no runner to test them on
  # (and no linker is needed for that).
  check:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-unknown-illumos
          - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
    - name: Clippy
      run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings

  # OpenBSD is a tier 3 target, without a prebuilt standard library, which
  # the nightly toolchain builds from source.  A nightly regression should not
  # fail the workflow.
  openbsd:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src
    - uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check -Zbuild-std=std --locked --target x86_64-unknown-openbsd
